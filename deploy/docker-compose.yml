# Run from this folder on the server: docker compose up -d --build
services:
  api:
    build: ../backend
    env_file: ../backend/.env
    restart: unless-stopped
  worker:
    build: ../backend
    env_file: ../backend/.env
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
  web:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: https://${API_HOST}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    env_file: ../frontend/.env.local
    environment:
      NEXT_PUBLIC_API_URL: https://${API_HOST}
    restart: unless-stopped
  caddy:
    image: caddy:2.10-alpine
    ports: ["80:80", "443:443"]
    environment:
      APP_HOST: ${APP_HOST}
      API_HOST: ${API_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api, web]
    restart: unless-stopped
volumes:
  caddy_data:
