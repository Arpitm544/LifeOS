[build-system]
requires = ['setuptools>=68', 'wheel']
build-backend = 'setuptools.build_meta'

[tool.setuptools.packages.find]
include = ['app*']

[project]
name = "lifeos-backend"
version = "0.1.0"
description = "Deterministic backend for LifeOS"
requires-python = ">=3.9"
dependencies = [
  "certifi>=2024.2.2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "python-jose[cryptography]>=3.3,<4",
  "dateparser>=1.2,<2",
  "python-dateutil>=2.9,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "httpx>=0.27,<1", "aiosqlite>=0.20,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


[tool.setuptools.package-data]
app = ['supabase-ca.crt']
